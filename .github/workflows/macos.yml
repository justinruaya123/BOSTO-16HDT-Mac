name: macOS package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      BT_LIVE_TESTS: '0'
    steps:
      - name: Require Apple Silicon
        run: test "$(uname -m)" = arm64
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run offline tests
        run: bash UnifiedDriver/test.sh
      - name: Run Multitouch regressions
        run: bash UnifiedDriver/regression.sh
      - name: Build package
        run: bash UnifiedDriver/build.sh
      - name: Verify package offline
        run: bash UnifiedDriver/verify.sh
      - name: Check release tag matches verified package version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          # verify.sh already checks the app and PackageInfo versions and payload equality.
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/unified/BostoTablet.app/Contents/Info.plist)
          test "$RELEASE_TAG" = "v$version"
      - name: Generate SHA-256
        working-directory: build/unified
        run: shasum -a 256 BostoTablet.pkg > SHA256SUMS
      - name: Upload package and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: BostoTablet-arm64
          path: |
            build/unified/BostoTablet.pkg
            build/unified/SHA256SUMS
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download verified package and checksum
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: BostoTablet-arm64
      - name: Verify SHA-256
        run: shasum -a 256 -c SHA256SUMS
      - name: Publish stable release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "BostoTablet $RELEASE_TAG" \
            --notes "Apple Silicon (arm64) package. Installer is unsigned and unnotarized; app is ad hoc signed. Includes SHA256SUMS for verification." \
            --latest \
            BostoTablet.pkg SHA256SUMS
